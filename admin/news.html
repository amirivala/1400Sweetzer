<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0a09" />
  <title>News · Admin · Sunset Penthouse</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,30..100;1,9..144,300..700,30..100&family=Geist+Mono:wght@400;500&family=Geist:wght@300;400;500;600&display=swap" />
  <link rel="stylesheet" href="/assets/styles.css?v=19" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body class="page">

  <main class="page__container">
    <header class="page-header rise delay-1">
      <span class="page-header__kicker">Admin · News</span>
      <div class="page-header__row">
        <div>
          <h1 class="page-header__title">Posts.</h1>
          <p class="page-header__sub">Write, edit, publish. Drafts stay private until you publish them.</p>
        </div>
        <a class="cta cta--solid" href="/admin/news-edit.html">
          <span>+ New post</span>
        </a>
      </div>
    </header>

    <section id="postList" class="admin-list" aria-live="polite">
      <div class="empty">
        <div class="empty__title">Loading…</div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.1/dist/umd/supabase.js" integrity="sha384-EjUdIVmzWliPzdzhxZ9ZoO0etXLKWuUPUftAGxP6qH6Lm4oLwoLaJR0Ba4pIDiDL" crossorigin="anonymous"></script>
  <script src="/assets/env.js"></script>
  <script src="/assets/supabase-client.js"></script>
  <script src="/assets/admin-guard.js"></script>
  <script src="/assets/page-shell.js?v=11"></script>
  <script src="/assets/dom.js"></script>
  <script>
    (async () => {
      const list = document.getElementById('postList');

      // Re-send a post's resident email via send_news_email (admin JWT,
      // force:true). Used for recovery when a send failed or never ran.
      const resend = async (postId, title, btn) => {
        if (!confirm('Re-send the email for "' + (title || 'Untitled') + '" to all opted-in residents?')) return;
        btn.disabled = true;
        const original = btn.textContent;
        btn.textContent = 'Sending…';
        try {
          const { data: { session } } = await window.sb.auth.getSession();
          const res = await fetch(`${window.ENV.SUPABASE_URL}/functions/v1/send_news_email`, {
            method: 'POST',
            headers: {
              'Authorization': 'Bearer ' + session.access_token,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ post_id: postId, force: true }),
          });
          const r = await res.json().catch(() => ({}));
          if (res.ok) { load(); }
          else { btn.textContent = 'Failed — retry'; btn.disabled = false; }
        } catch (e) {
          btn.textContent = 'Failed — retry'; btn.disabled = false;
        }
      };

      const load = async () => {
        const { data, error } = await window.sb
          .from('news_posts')
          .select(`
            id, title, published, email_residents, published_at, created_at,
            email_sent_at, email_sent_count, email_send_error,
            author:profiles!author_id ( full_name )
          `)
          .order('created_at', { ascending: false });

        if (error) {
          mount(list,
            el('div', { class: 'empty' },
              el('div', { class: 'empty__title', text: 'Trouble loading posts' }),
              el('p', { class: 'empty__sub', text: error.message }),
            ));
          return;
        }
        if (!data || data.length === 0) {
          mount(list,
            el('div', { class: 'empty' },
              el('div', { class: 'empty__title', text: 'No posts yet' }),
              el('p', { class: 'empty__sub', text: 'Tap "New post" to write the first one.' }),
            ));
          return;
        }

        const rows = data.map((p) => {
          const dateIso = p.published_at || p.created_at;
          const status = p.published
            ? el('span', { class: 'admin-status-pill admin-status-pill--published', text: 'Published' })
            : el('span', { class: 'admin-status-pill admin-status-pill--draft', text: 'Draft' });

          // Email status (published posts only). Reflects the real send
          // recorded by send_news_email, not just whether the toggle was on.
          let emailMeta = null;
          if (p.published && p.email_residents) {
            if (p.email_sent_at) {
              emailMeta = el('span', { text: `· emailed ${p.email_sent_count ?? ''} · ${fmt.date(p.email_sent_at)}` });
            } else if (p.email_send_error) {
              emailMeta = el('span', { style: { color: 'var(--danger, #c0392b)' }, text: '· email failed' });
            } else {
              emailMeta = el('span', { style: { color: 'var(--paper-mute)' }, text: '· not emailed yet' });
            }
          }

          return el('article', { class: 'card liquid-glass admin-row' },
            el('div', { class: 'admin-row__main' },
              el('a', {
                class: 'admin-row__title',
                href: '/admin/news-edit.html?id=' + encodeURIComponent(p.id),
                text: p.title || 'Untitled',
              }),
              el('div', { class: 'admin-row__meta' },
                status,
                el('span', { text: fmt.date(dateIso) }),
                p.author?.full_name ? el('span', { text: p.author.full_name }) : null,
                emailMeta,
              ),
            ),
            el('div', { class: 'admin-row__actions' },
              el('a', {
                class: 'btn-mini',
                href: p.published ? '/post.html?id=' + encodeURIComponent(p.id) : '#',
                text: p.published ? 'View' : '—',
              }),
              el('a', {
                class: 'btn-mini',
                href: '/admin/news-edit.html?id=' + encodeURIComponent(p.id),
                text: 'Edit',
              }),
              (p.published && p.email_residents)
                ? el('button', {
                    class: 'btn-mini',
                    type: 'button',
                    text: p.email_sent_at ? 'Re-send' : 'Send email',
                    onclick: (e) => resend(p.id, p.title, e.currentTarget),
                  })
                : null,
              el('button', {
                class: 'btn-mini btn-mini--danger',
                type: 'button',
                text: 'Delete',
                onclick: async () => {
                  if (!confirm('Delete "' + (p.title || 'Untitled') + '"?')) return;
                  // Remove attachment objects first \u2014 rows cascade with the
                  // post, but the storage objects would otherwise be orphaned.
                  const { data: atts } = await window.sb.from('post_attachments')
                    .select('storage_path').eq('news_post_id', p.id);
                  if (atts && atts.length) {
                    await window.sb.storage.from('post-attachments')
                      .remove(atts.map((a) => a.storage_path));
                  }
                  const { error: dErr } = await window.sb
                    .from('news_posts').delete().eq('id', p.id);
                  if (dErr) { alert('Couldn\u2019t delete: ' + dErr.message); return; }
                  load();
                },
              }),
            ),
          );
        });

        mount(list, ...rows);
      };

      load();
    })();
  </script>
</body>
</html>
