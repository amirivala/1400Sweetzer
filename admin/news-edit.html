<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0a09" />
  <title>Write · Admin · Sunset Penthouse</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,30..100;1,9..144,300..700,30..100&family=Geist+Mono:wght@400;500&family=Geist:wght@300;400;500;600&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" integrity="sha384-ecIckRi4QlKYya/FQUbBUjS4qp65jF/J87Guw5uzTbO1C1Jfa/6kYmd6dXUF6D7i" crossorigin="anonymous" />
  <link rel="stylesheet" href="/assets/styles.css?v=19" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body class="page">

  <main class="page__container">
    <header class="page-header rise delay-1">
      <span class="page-header__kicker">Admin · News</span>
      <h1 class="page-header__title" id="pageTitle">Write a post.</h1>
      <p class="page-header__sub">
        Save as a draft, or publish to push it to the news feed (and email
        residents if you tick the box).
      </p>
    </header>

    <form id="form" class="editor-shell rise delay-2" autocomplete="off">

      <div>
        <input
          id="title"
          class="editor-input-title"
          type="text"
          required
          maxlength="200"
          placeholder="A title for this post"
        />
      </div>

      <div class="editor-cover">
        <label for="cover" style="font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--paper-dim);">
          Cover image URL (optional)
        </label>
        <input id="cover" type="url" placeholder="https://…" />
      </div>

      <div id="qeditor"></div>

      <div class="editor-cover" id="attachWrap">
        <label for="attachFile" style="font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--paper-dim);">
          Attachments (optional)
        </label>
        <div id="attachList" class="attach-list"></div>
        <input id="attachFile" type="file" multiple
               accept=".pdf,.xlsx,.xls,.docx,.jpg,.jpeg,.png,application/pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/jpeg,image/png" />
        <span id="attachHint" class="account-hint">PDF, Word, Excel, or images up to 50 MB. Residents can download these from the post.</span>
      </div>

      <label class="toggle">
        <input id="emailToggle" type="checkbox" checked />
        <div class="toggle__label">
          <span class="toggle__title">Email residents on publish</span>
          <span class="toggle__hint">A short note goes out via Resend to everyone opted in. Doesn't re-send on subsequent edits.</span>
        </div>
        <span class="toggle__switch" aria-hidden="true"></span>
      </label>

      <div class="editor-actions">
        <a class="btn-mini" href="/admin/news.html">← All posts</a>
        <span class="spacer"></span>
        <p id="status" class="account-status" style="margin: 0;"></p>
        <button type="button" id="deleteBtn" class="btn-mini btn-mini--danger" style="display: none;">Delete</button>
        <button type="button" id="draftBtn" class="cta liquid-glass-strong">
          <span>Save draft</span>
        </button>
        <button type="submit" id="publishBtn" class="cta cta--solid">
          <span id="publishBtnLabel">Publish</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 17L17 7"/><path d="M7 7h10v10"/>
          </svg>
        </button>
      </div>

    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.1/dist/umd/supabase.js" integrity="sha384-EjUdIVmzWliPzdzhxZ9ZoO0etXLKWuUPUftAGxP6qH6Lm4oLwoLaJR0Ba4pIDiDL" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js" integrity="sha384-utBUCeG4SYaCm4m7GQZYr8Hy8Fpy3V4KGjBZaf4WTKOcwhCYpt/0PfeEe3HNlwx8" crossorigin="anonymous"></script>
  <script src="/assets/env.js"></script>
  <script src="/assets/supabase-client.js"></script>
  <script src="/assets/admin-guard.js"></script>
  <script src="/assets/page-shell.js?v=11"></script>
  <script src="/assets/dom.js"></script>
  <script>
    (async () => {
      const titleEl  = document.getElementById('title');
      const coverEl  = document.getElementById('cover');
      const emailEl  = document.getElementById('emailToggle');
      const statusEl = document.getElementById('status');
      const draftBtn = document.getElementById('draftBtn');
      const publishBtn = document.getElementById('publishBtn');
      const publishBtnLabel = document.getElementById('publishBtnLabel');
      const deleteBtn = document.getElementById('deleteBtn');
      const pageTitle = document.getElementById('pageTitle');

      const quill = new Quill('#qeditor', {
        theme: 'snow',
        placeholder: 'Write the body of your post…',
        modules: {
          toolbar: [
            [{ header: [2, 3, false] }],
            ['bold', 'italic', 'underline', 'strike'],
            [{ list: 'ordered' }, { list: 'bullet' }],
            ['link', 'blockquote'],
            ['clean'],
          ],
        },
      });

      const { data: { session } } = await window.sb.auth.getSession();
      if (!session) return;

      // Mutable so a fresh draft's id (set after the first insert) flows
      // through to subsequent saves as an UPDATE — otherwise each save
      // creates a duplicate row.
      let currentId = new URLSearchParams(location.search).get('id');
      let isPublished = false;
      let hasPublishedAt = false;
      let hasEmailSent = false;

      if (currentId) {
        // Editing existing
        const { data: post, error } = await window.sb
          .from('news_posts')
          .select('id, title, body, cover_image_url, published, email_residents, published_at, email_sent_at')
          .eq('id', currentId).single();
        if (error || !post) {
          statusEl.textContent = 'Couldn\u2019t load post: ' + (error?.message || 'not found');
          return;
        }
        titleEl.value     = post.title || '';
        coverEl.value     = post.cover_image_url || '';
        emailEl.checked   = !!post.email_residents;
        isPublished       = !!post.published;
        hasPublishedAt    = !!post.published_at;
        hasEmailSent      = !!post.email_sent_at;
        // Setting Quill from a string of HTML — Quill handles its own
        // sanitization for the editor view; this is content authored by
        // an admin previously, sanitized again on render via DOMPurify
        // on /post.html.
        quill.clipboard.dangerouslyPasteHTML(post.body || '');
        publishBtnLabel.textContent = isPublished ? 'Save changes' : 'Publish';
        pageTitle.textContent = isPublished ? 'Edit post.' : 'Continue draft.';
        deleteBtn.style.display = '';
      }

      // ── Attachments ────────────────────────────────────────────
      const ATTACH_BUCKET = 'post-attachments';
      const attachListEl = document.getElementById('attachList');
      const attachFileEl = document.getElementById('attachFile');
      const attachHintEl = document.getElementById('attachHint');
      const ATTACH_HINT  = 'PDF, Word, Excel, or images up to 50 MB. Residents can download these from the post.';
      const extOf = (name) => (name.includes('.') ? name.split('.').pop() : '').toLowerCase();
      const ATTACH_MIME = {
        pdf:'application/pdf',
        xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
        xls:'application/vnd.ms-excel',
        docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
        jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png',
      };
      const fmtBytes = (n) => {
        if (n == null) return '';
        if (n < 1024) return n + ' B';
        if (n < 1024 * 1024) return Math.round(n / 1024) + ' KB';
        return (n / (1024 * 1024)).toFixed(1).replace(/\.0$/, '') + ' MB';
      };
      let attachments = [];

      const renderAttachments = () => {
        if (!attachments.length) {
          mount(attachListEl, el('p', { class: 'attach-empty',
            text: currentId ? 'No files attached yet.' : 'Pick a file below — a draft saves automatically.' }));
          return;
        }
        mount(attachListEl, ...attachments.map((a) =>
          el('div', { class: 'attach-row' },
            el('span', { class: 'attach-row__type', text: (extOf(a.file_name) || 'file').toUpperCase() }),
            el('span', { class: 'attach-row__name', text: a.file_name }),
            el('span', { class: 'attach-row__size', text: fmtBytes(a.size_bytes) }),
            el('button', { class: 'btn-mini btn-mini--danger', type: 'button', text: 'Remove',
              onclick: () => removeAttachment(a) }),
          )));
      };

      const loadAttachments = async () => {
        if (!currentId) { attachments = []; renderAttachments(); return; }
        const { data, error } = await window.sb
          .from('post_attachments')
          .select('id, file_name, mime_type, size_bytes, storage_path, sort_order')
          .eq('news_post_id', currentId)
          .order('sort_order', { ascending: true })
          .order('created_at', { ascending: true });
        if (error) { attachHintEl.textContent = 'Couldn’t load attachments: ' + error.message; return; }
        attachments = data || [];
        renderAttachments();
      };

      const removeAttachment = async (a) => {
        if (!confirm('Remove “' + a.file_name + '”?')) return;
        const { error: sErr } = await window.sb.storage.from(ATTACH_BUCKET).remove([a.storage_path]);
        if (sErr) { alert('Couldn’t remove the file: ' + sErr.message); return; }
        const { error: dErr } = await window.sb.from('post_attachments').delete().eq('id', a.id);
        if (dErr) { alert('File removed but row delete failed: ' + dErr.message); return; }
        await loadAttachments();
      };

      attachFileEl.addEventListener('change', async () => {
        const files = Array.from(attachFileEl.files || []);
        if (!files.length) return;
        // Attachments hang off the post id; create a draft first if needed.
        if (!currentId) {
          attachHintEl.textContent = 'Saving a draft so files have somewhere to live…';
          await save(false);
          if (!currentId) { attachHintEl.textContent = 'Add a title and body first, then attach files.'; attachFileEl.value = ''; return; }
        }
        attachHintEl.textContent = 'Uploading…';
        let nextSort = attachments.length;
        for (const file of files) {
          const ext = extOf(file.name);
          if (!ATTACH_MIME[ext]) {
            attachHintEl.textContent = 'Skipped ' + file.name + ' — use PDF, Word, Excel, JPG, or PNG.';
            continue;
          }
          const contentType = ATTACH_MIME[ext];
          const path = 'news/' + crypto.randomUUID() + '.' + ext;
          const { error: upErr } = await window.sb.storage.from(ATTACH_BUCKET)
            .upload(path, file, { contentType, upsert: false });
          if (upErr) { attachHintEl.textContent = 'Upload failed for ' + file.name + ': ' + upErr.message; continue; }
          const { error: dbErr } = await window.sb.from('post_attachments').insert({
            news_post_id: currentId,
            storage_path: path,
            file_name: file.name,
            mime_type: contentType,
            size_bytes: file.size,
            sort_order: nextSort++,
            created_by: session.user.id,
          });
          if (dbErr) {
            await window.sb.storage.from(ATTACH_BUCKET).remove([path]); // avoid orphan
            attachHintEl.textContent = 'Couldn’t attach ' + file.name + ': ' + dbErr.message;
            continue;
          }
        }
        attachFileEl.value = '';
        attachHintEl.textContent = ATTACH_HINT;
        await loadAttachments();
      });

      const collect = (publish) => {
        const title = titleEl.value.trim();
        const body  = quill.root.innerHTML.trim();
        if (!title) { statusEl.textContent = 'Title is required.'; titleEl.focus(); return null; }
        if (!body || body === '<p><br></p>') {
          statusEl.textContent = 'Body is required.'; quill.focus(); return null;
        }
        const payload = {
          title,
          body,
          cover_image_url: coverEl.value.trim() || null,
          author_id: session.user.id,
          published: publish,
          email_residents: emailEl.checked,
        };
        // Stamp published_at on first publish, and also self-heal any
        // existing published row whose stamp is missing (e.g. from the
        // previous editor bug that could leave published_at null).
        if (publish && !hasPublishedAt) payload.published_at = new Date().toISOString();
        return payload;
      };

      // The resident email is now sent server-side: a DB trigger fires
      // send_news_email the moment a post is published with the toggle on.
      // The browser no longer sends it (that was fragile \u2014 a closed tab lost
      // the email). We just poll the row briefly to confirm it went out.
      const pollSent = async (postId) => {
        statusEl.textContent = 'Published \u2713 \u00b7 emailing residents\u2026';
        for (let i = 0; i < 6; i++) {
          await new Promise((r) => setTimeout(r, 2500));
          const { data } = await window.sb
            .from('news_posts')
            .select('email_sent_at, email_sent_count, email_send_error')
            .eq('id', postId).single();
          if (data?.email_sent_at) {
            const n = data.email_sent_count || 0;
            statusEl.textContent = `Published \u2713 \u00b7 emailed ${n} resident${n === 1 ? '' : 's'}`;
            hasEmailSent = true;
            return;
          }
          if (data?.email_send_error) {
            statusEl.textContent = 'Published \u2713 \u00b7 email failed \u2014 re-send from the posts list';
            return;
          }
        }
        statusEl.textContent = 'Published \u2713 \u00b7 email is sending (check status in the posts list)';
      };

      const save = async (publish) => {
        statusEl.textContent = 'Saving…';
        draftBtn.disabled = publishBtn.disabled = true;

        // The DB trigger sends the email when a published post has the toggle
        // on and hasn't been emailed yet. If that's the case, we'll poll to
        // confirm; otherwise (already sent, or edit-after-send) nothing mails.
        const willEmail = publish && emailEl.checked && !hasEmailSent;

        const payload = collect(publish);
        if (!payload) { draftBtn.disabled = publishBtn.disabled = false; return; }

        let error;
        if (currentId) {
          ({ error } = await window.sb.from('news_posts').update(payload).eq('id', currentId));
        } else {
          const { data, error: iErr } = await window.sb
            .from('news_posts').insert(payload).select('id').single();
          error = iErr;
          if (data?.id) {
            currentId = data.id;
            // Rewrite URL so subsequent saves edit, not insert.
            history.replaceState(null, '', '/admin/news-edit.html?id=' + encodeURIComponent(data.id));
          }
        }

        draftBtn.disabled = publishBtn.disabled = false;

        if (error) { statusEl.textContent = 'Couldn\u2019t save: ' + error.message; return; }

        if (publish) {
          statusEl.textContent = 'Published \u2713';
          isPublished = true;
          if (payload.published_at) hasPublishedAt = true;
          publishBtnLabel.textContent = 'Save changes';
          deleteBtn.style.display = '';
          pageTitle.textContent = 'Edit post.';
          if (willEmail && currentId) await pollSent(currentId);
        } else {
          statusEl.textContent = 'Draft saved \u2713';
          deleteBtn.style.display = '';
        }
      };

      draftBtn.addEventListener('click', () => save(false));
      document.getElementById('form').addEventListener('submit', (e) => {
        e.preventDefault();
        save(true);
      });

      deleteBtn.addEventListener('click', async () => {
        if (!currentId) return;
        if (!confirm('Delete this post for good?')) return;
        // Remove attachment objects first \u2014 their rows cascade with the post,
        // but the storage objects would otherwise be orphaned.
        const { data: atts } = await window.sb.from('post_attachments')
          .select('storage_path').eq('news_post_id', currentId);
        if (atts && atts.length) {
          await window.sb.storage.from(ATTACH_BUCKET).remove(atts.map((a) => a.storage_path));
        }
        const { error } = await window.sb.from('news_posts').delete().eq('id', currentId);
        if (error) { alert('Couldn\u2019t delete: ' + error.message); return; }
        location.href = '/admin/news.html';
      });

      await loadAttachments();
    })();
  </script>
</body>
</html>
